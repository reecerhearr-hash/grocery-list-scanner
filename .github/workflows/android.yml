name: Build Android app

# Builds the APK and publishes it on the Releases page every time main changes.
# Download link that always points at the newest build:
#   https://github.com/${{ github.repository }}/releases/latest/download/GroceryList.apk
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 2.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Bundle web app into Android project
        run: npm run build

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Android SDK
        run: |
          if [ -z "$ANDROID_HOME" ] || [ ! -d "$ANDROID_HOME" ]; then
            export ANDROID_HOME="$HOME/android-sdk"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -o /tmp/tools.zip
            unzip -q /tmp/tools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          fi
          echo "Using Android SDK at $ANDROID_HOME"
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build signed APK
        working-directory: android
        env:
          # Signing key lives in android/release.keystore (private repo). Same key every build, so updates install over the old app..
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/release.keystore
          ANDROID_KEYSTORE_PASSWORD: 'ilRgXqCUBxPyLGzorN_MVne2'
          ANDROID_KEY_ALIAS: grocerylist
          ANDROID_KEY_PASSWORD: 'ilRgXqCUBxPyLGzorN_MVne2'
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/GroceryList.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: GroceryList-${{ env.VERSION_NAME }}
          path: GroceryList.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION_NAME" GroceryList.apk \
            --title "Grocery List $VERSION_NAME" \
            --latest \
            --notes "**Install:** on your Android phone, tap **GroceryList.apk** below → Open → allow installs from this source if asked → Install. Installing a newer version keeps your list."
